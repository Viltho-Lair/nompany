name: CI

# NOTHING ENFORCED THE SUITE BEFORE THIS. tests/suite.mjs is ~1700 lines of
# genuinely good work that nobody was obliged to keep green, and Gate A's whole
# purpose — recording the contract before the refactor rewrites the layers under
# it — is worthless if the recording is only checked when somebody remembers.
#
# The suite talks to Redis. In development that is a LIVE, SHARED Redis Cloud
# instance, isolated only by NOMPANY_KEY_PREFIX. CI gets its own ephemeral
# `redis:8` service container instead: the prefix stays as the second line of
# defence, never the first, and a pull request can never reach production data.
#
# POSTGRES (P1 store swap) IS PROVISIONED THE SAME WAY, WITH ONE EXTRA STEP
# REDIS NEVER NEEDED. The `postgres:18` image's bootstrap user is a REAL
# SUPERUSER inside the container, and a superuser BYPASSES ROW-LEVEL SECURITY
# ENTIRELY — production's role does not (measured: rolsuper=false,
# rolbypassrls=false against a policy declared FORCE ROW LEVEL SECURITY). If
# this workflow connected as that bootstrap user, every tenant-isolation
# assertion in tests/pg-parity.mjs would pass without RLS ever being enforced —
# green for a reason that does not hold in production, which is worse than
# red. So a dedicated, ordinary role is created below and CI connects as THAT
# role; a step right after asserts its shape so this cannot regress silently.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first — a queue of stale runs
# tells you about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
        # Redis 8 is what production runs; pinning the major means a test that
        # passes here fails there for a reason we would actually find.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:18
        env:
          # The BOOTSTRAP superuser, used ONLY by the role-provisioning step
          # below to create an ordinary role and hand it the database. No test
          # and no application code ever connects as this user — DATABASE_URL
          # (below) always points at the non-superuser role instead.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nompany_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379
      NOMPANY_KEY_PREFIX: ci_
      # THE NON-SUPERUSER ROLE'S connection string, not the bootstrap user's.
      # Set unconditionally — this job ALWAYS provisions Postgres, so from
      # here on a missing/broken DATABASE_URL is a real failure this workflow
      # should surface, not a condition any test needs to tolerate.
      DATABASE_URL: postgresql://ci_app:ci_app_pw@localhost:5432/nompany_ci
      # The suite mints real bcrypt hashes and real AES field encryption; both
      # need a key present or they take their fail-open path and prove nothing.
      FIELD_ENCRYPTION_KEY: ci-only-not-a-real-key-0000000000
      # Never a real one. Anything that tries to send mail in CI should fail
      # loudly rather than deliver.
      RESEND_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Provision a non-superuser Postgres role for CI (matches production's RLS posture)
        # Connects as the container's bootstrap superuser (POSTGRES_PASSWORD
        # above) ONE TIME to create an ordinary role and hand it the database
        # collection_rows will live in. ci_app owns nothing it should not:
        # NOSUPERUSER and NOBYPASSRLS are the two flags that matter (see the
        # workflow header), NOCREATEDB/NOCREATEROLE/NOREPLICATION because it
        # needs none of them either. Granting it the schema (rather than the
        # bootstrap user creating the table) means ci_app itself OWNS
        # collection_rows once schema.mjs runs — a table owner can enable/
        # force RLS and create policies on its own objects with no BYPASSRLS
        # grant at all, the same shape production's role has.
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d nompany_ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ci_app') THEN
              CREATE ROLE ci_app LOGIN PASSWORD 'ci_app_pw'
                NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOREPLICATION;
            END IF;
          END
          $$;
          GRANT ALL PRIVILEGES ON DATABASE nompany_ci TO ci_app;
          GRANT ALL PRIVILEGES ON SCHEMA public TO ci_app;
          SQL

      - name: Verify the CI Postgres role cannot bypass row-level security
        # FIX ROUND 1 (whole-branch review): the previous version of this
        # check connected as the BOOTSTRAP SUPERUSER and asked
        # "WHERE rolname = 'ci_app'" — a literal name lookup that proves "a
        # role named ci_app is shaped safely" and nothing about whether
        # DATABASE_URL (what every suite below actually connects as) still
        # points at that role. Repoint DATABASE_URL at the bootstrap
        # `postgres` user later — to debug something, because a step needed
        # more privilege — and leave this step untouched, and it stays green
        # while every suite runs as a superuser with RLS silently bypassed:
        # the exact failure this step exists to catch, reached from the
        # other direction.
        #
        # So this now connects THROUGH $DATABASE_URL itself and asks about
        # current_user — whatever role the URL names is the one inspected,
        # by construction, so the check cannot go stale independently of the
        # credential downstream tests use.
        run: |
          result=$(psql "$DATABASE_URL" -tAc \
            "SELECT current_user, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user")
          role="${result%%|*}"
          flags="${result#*|}"
          echo "DATABASE_URL connects as '${role}', shape (rolsuper|rolbypassrls): ${flags}"
          if [ "${flags}" != "f|f" ]; then
            echo "::error::the role DATABASE_URL actually connects as ('${role}') must be rolsuper=false and rolbypassrls=false to match production (viltho) — got '${flags}'. A superuser (or any role granted BYPASSRLS) silently bypasses row-level security, so every tenant-isolation test in this run would pass for a reason that does not hold in production." >&2
            exit 1
          fi

      - name: Apply the Postgres schema
        # BEFORE any suite that needs collection_rows — tests/pg-parity.mjs
        # (folded into the integration suite and Gate A) reads back what this
        # applied rather than creating anything itself. Idempotent
        # (CREATE ... IF NOT EXISTS / DROP POLICY IF EXISTS + CREATE POLICY),
        # so re-running it here every job costs nothing.
        run: node scripts/migrate/pg/schema.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck — converted folders, strictly
        # THE RATCHET. The repo-wide config runs with checkJs and noImplicitAny
        # off, because grading a hundred files nobody wrote types for produces a
        # number that gets ignored. This one grades only what Wave 3 has
        # converted, with noImplicitAny ON, and a folder joins its `include` when
        # its step lands and never leaves.
        #
        # Two configs meeting is how Wave 3 ends: when `include` covers src/**,
        # this file and the allowJs escape hatch both go.
        run: npx tsc --noEmit -p tsconfig.strict.json

      - name: Lint
        # Errors are always fatal. Warnings are a backlog with a ceiling that can
        # only go down — see scripts/lint-budget.mjs for why neither "fail on
        # every warning" nor "warn forever" survives contact with a real backlog.
        #
        # This step also earns its place on the day it landed: it found a SYNTAX
        # ERROR in api/cron/year-rollover that `tsc --noEmit` had passed, because
        # tsconfig sets checkJs false and the file is .js.
        run: node scripts/lint-budget.mjs

      - name: Tests — access rules
        run: node tests/access.test.mjs

      - name: Tests — integration suite
        # Now also runs tests/pg-parity.mjs's schema/RLS/row-primitive/dispatcher
        # assertions (folded in via tests/suite.mjs) against the postgres
        # service above, as ci_app — DATABASE_URL is set job-wide, so nothing
        # here is skipped.
        run: node tests/integration.test.mjs

      - name: Gate A — goldens, permission matrix, hop counts
        # Golden responses are the parity contract: a renamed field, a null that
        # became "", a dropped key or a changed status code fails HERE rather
        # than reaching a client. Re-recording is a deliberate act with its own
        # commit — it must never happen in CI, so NOMPANY_RECORD_GOLDENS is not
        # set and cannot be.
        run: node tests/gate-a.test.mjs

      - name: Tests — Postgres + parity (NOMPANY_DB=parity)
        # THE PIECE THAT WAS PRESENT IN package.json AND ABSENT FROM THIS
        # WORKFLOW: `npm test`/the two steps above run with NOMPANY_DB unset,
        # i.e. DB_BACKEND="redis" — the postgres and parity dispatcher branches
        # in sections.ts, pgRows.ts's query builder ceilings
        # (tests/gate-a.mjs's DB_BACKEND !== "redis" block), and pg-parity.mjs's
        # 41 assertions only run under NOMPANY_DB=postgres or =parity. Without
        # this step they ran only when a human remembered to run
        # `npm run test:parity` locally — this makes that automatic.
        run: npm run test:parity

      - name: Build
        run: npx next build

      - name: Client bundle budget
        # 1.06 MB gzipped today across 51 chunks, with a single 312 KB chunk.
        # The ceiling is set ABOVE that on purpose: this pins the REGRESSION, not
        # the current size, and comes down as the component split lands.
        run: node scripts/bundle-budget.mjs
